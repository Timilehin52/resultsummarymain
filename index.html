<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <title>Frontend Mentor | Results summary component</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="main">
      <div class="sub">
        <h2 class="soft">Your Result</h2>

        <div class="paper">
          <h2 class="per">76</h2>
          <span class="rtt">of 100</span>
        </div>

        <h1>Great</h1>
        <p class="dent">
          You scored higher than 65% of <br />the people who have taken these
          tests.
        </p>
      </div>

      <div class="great">
        <h2>Summary</h2>
        <div class="col">
          <div class="mem">
            <div>
              <img
                src="assets/images/icon-reaction.svg"
                alt="reaction"
                class="r"
              />
              <p>Reaction</p>
            </div>
            <p class="rt">80 <span>/100</span></p>
          </div>
          <div class="mem2">
            <div>
              <img src="assets/images/icon-memory.svg" alt="" class="r" />
              <p>Memory</p>
            </div>
            <p class="rt">92<span>/100</span></p>
          </div>
          <div class="mem3">
            <div>
              <img src="assets/images/icon-verbal.svg" alt="" class="r" />
              <p>Verbal</p>
            </div>
            <p class="rt">61<span>/100</span></p>
          </div>
          <div class="mem4">
            <div>
              <img src="assets/images/icon-visual.svg" alt="" class="r" />
              <p>Visual</p>
            </div>
            <p class="rt">73<span>/100</span></p>
          </div>
        </div>
        <button>Continue</button>
      </div>
    </div>
  </body>
</html>
